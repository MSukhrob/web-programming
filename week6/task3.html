<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>random user generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      line-height: 1.5;
    }
    .profile-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    .avatar-wrapper {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 16px;
      overflow: hidden;
      border: 3px solid #2563eb;
      background-color: #e2e8f0;
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.35rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    p.user-email {
      font-size: 0.9rem;
      color: #2563eb;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .info-list {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .info-label {
      color: #64748b;
      font-weight: 500;
    }
    .info-value {
      color: #0f172a;
      font-weight: 600;
      text-align: right;
    }
    .status-text {
      font-size: 0.85rem;
      color: #64748b;
      min-height: 20px;
      margin-bottom: 16px;
    }
    .error-text {
      color: #dc2626;
      font-weight: 500;
    }
    button.btn-next {
      width: 100%;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    button.btn-next:hover {
      background-color: #1d4ed8;
    }
    button.btn-next:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar-wrapper">
      <img id="userAvatar" src="" alt="user avatar">
    </div>

    <h1 id="userName">loading name...</h1>
    <p id="userEmail" class="user-email">loading email...</p>

    <div class="info-list">
      <div class="info-item">
        <span class="info-label">location</span>
        <span id="userLocation" class="info-value">—</span>
      </div>
      <div class="info-item">
        <span class="info-label">phone</span>
        <span id="userPhone" class="info-value">—</span>
      </div>
      <div class="info-item">
        <span class="info-label">age</span>
        <span id="userAge" class="info-value">—</span>
      </div>
      <div class="info-item">
        <span class="info-label">nationality</span>
        <span id="userNat" class="info-value">—</span>
      </div>
    </div>

    <div id="statusMsg" class="status-text">fetching random user...</div>

    <button id="nextBtn" class="btn-next" onclick="fetchUser()">get new user</button>
  </div>

  <script>
    async function fetchUser() {
      const btn = document.getElementById('nextBtn');
      const status = document.getElementById('statusMsg');

      btn.disabled = true;
      status.className = 'status-text';
      status.textContent = 'loading user profile...';

      try {
        const response = await fetch('https://randomuser.me/api/');
        if (!response.ok) {
          throw new Error('http error ' + response.status);
        }

        const data = await response.json();
        const user = data.results && data.results[0];

        if (!user) {
          throw new Error('invalid response format');
        }

        document.getElementById('userAvatar').src = user.picture.large;
        document.getElementById('userName').textContent = user.name.first + ' ' + user.name.last;
        document.getElementById('userEmail').textContent = user.email;
        document.getElementById('userLocation').textContent = user.location.city + ', ' + user.location.country;
        document.getElementById('userPhone').textContent = user.phone;
        document.getElementById('userAge').textContent = user.dob.age + ' years old';
        document.getElementById('userNat').textContent = user.nat;

        status.textContent = 'profile loaded';
      } catch (err) {
        status.className = 'status-text error-text';
        status.textContent = 'could not load user: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    fetchUser();
  </script>
</body>
</html>
