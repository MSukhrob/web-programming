<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>student registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      padding: 40px 16px 80px;
      line-height: 1.5;
    }
    .card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    p.intro {
      font-size: 0.9rem;
      color: #64748b;
    }
    fieldset {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 18px 20px 22px;
      margin-bottom: 20px;
    }
    legend {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #2563eb;
      padding: 0 8px;
    }
    .field {
      margin-top: 14px;
    }
    .field:first-of-type {
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 13px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }
    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }
    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
      background-color: #fef2f2;
    }
    select:valid {
      border-color: #16a34a;
    }
    .range-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .range-val {
      font-size: 0.85rem;
      font-weight: 600;
      color: #2563eb;
      min-width: 45px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 24px;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .checkbox-row label {
      margin-bottom: 0;
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }
    .success-alert {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background-color: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>student registration</h1>
      <p class="intro">fill out the form below with valid student details</p>
    </header>

    <form method="post" action="#" onsubmit="handleRegistration(event)">
      <fieldset>
        <legend>personal information</legend>

        <div class="field">
          <label for="fullName">full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            required
            minlength="2"
            placeholder="enter your full name"
          >
        </div>

        <div class="field">
          <label for="studentId">student id</label>
          <input
            type="text"
            id="studentId"
            name="studentId"
            required
            pattern="\d{9}"
            placeholder="9-digit id e.g. 202612345"
          >
        </div>

        <div class="field">
          <label for="dob">date of birth</label>
          <input
            type="date"
            id="dob"
            name="dob"
            required
          >
        </div>

        <div class="field">
          <label for="major">academic major</label>
          <select id="major" name="major" required>
            <option value="">-- select your major --</option>
            <option value="Computer Science">computer science</option>
            <option value="Software Engineering">software engineering</option>
            <option value="Information Technology">information technology</option>
            <option value="Artificial Intelligence">artificial intelligence</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>account information</legend>

        <div class="field">
          <label for="email">email address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="student@gachon.ac.kr"
          >
        </div>

        <div class="field">
          <label for="password">password (min 8 characters)</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
            placeholder="enter password"
          >
        </div>

        <div class="field">
          <label for="phone">phone number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            pattern="\d{3}-\d{4}-\d{4}"
            placeholder="010-1234-5678"
          >
        </div>

        <div class="field">
          <label for="exp">coding experience (years)</label>
          <div class="range-box">
            <input
              type="range"
              id="exp"
              name="exp"
              min="0"
              max="10"
              value="1"
              oninput="document.getElementById('expDisplay').textContent = this.value + ' yrs'"
            >
            <span id="expDisplay" class="range-val">1 yrs</span>
          </div>
        </div>
      </fieldset>

      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">i agree to the student registration terms</label>
      </div>

      <button type="submit">submit registration</button>
      <div id="regSuccess" class="success-alert"></div>
    </form>
  </div>

  <script>
    function handleRegistration(event) {
      event.preventDefault();
      const alertBox = document.getElementById('regSuccess');
      const name = document.getElementById('fullName').value;
      alertBox.style.display = 'block';
      alertBox.textContent = 'registration completed successfully for ' + name;
    }
  </script>
</body>
</html>
