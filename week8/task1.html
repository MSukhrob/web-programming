<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form – Samarkand Library</title>
  <style>
    :root {
      --paper: #fbf6ec;
      --ink: #1f2a44;
      --muted: #6b6a63;
      --lapis: #1d4e89;
      --turquoise: #2a9d8f;
      --saffron: #e9a23b;
      --brick: #b83a2e;
      --line: #e4d9c3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .shell {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      width: 100%;
      max-width: 820px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(31, 42, 68, .12);
    }
    .side {
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 12px, transparent 12px 24px),
        linear-gradient(160deg, var(--lapis), #14355e);
      color: #fff;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }
    .side h2 { font-family: Georgia, serif; font-size: 1.7rem; line-height: 1.2; }
    .side p { color: #cfdcf0; margin-top: 12px; font-size: .95rem; }
    .side ul { list-style: none; font-size: .9rem; display: grid; gap: 10px; }
    .side li::before { content: "✦ "; color: var(--saffron); }
    .panel { padding: 40px 34px; }
    .panel h1 { font-family: Georgia, serif; font-size: 1.6rem; }
    .panel .hint { color: var(--muted); font-size: .9rem; margin: 6px 0 26px; }
    .row { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
    .control { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      font: inherit;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fffdf8;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus-visible {
      outline: none;
      border-color: var(--lapis);
      box-shadow: 0 0 0 4px rgba(29, 78, 137, .15);
    }
    .toggle {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--lapis);
      font-weight: 600;
      font-size: .8rem;
      cursor: pointer;
      padding: 6px 8px;
    }
    .extras { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; font-size: .85rem; }
    .remember { display: flex; align-items: center; gap: 8px; }
    .remember input { accent-color: var(--turquoise); width: 16px; height: 16px; }
    .remember label { margin: 0; font-weight: 400; }
    .extras a { color: var(--lapis); text-decoration: none; }
    .extras a:hover { text-decoration: underline; }
    .go {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--turquoise);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, background .2s;
    }
    .go:hover { background: #22857a; transform: translateY(-1px); }
    #status {
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: .88rem;
      display: none;
    }
    #status.ok { display: block; background: #e5f5ef; border: 1px solid #a8dcc9; color: #1b6b52; }
    @media (max-width: 680px) {
      .shell { grid-template-columns: 1fr; }
      .side { padding: 26px 24px; }
      .side ul { display: none; }
      .panel { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <aside class="side">
      <div>
        <h2>Welcome back to the reading room</h2>
        <p>Sign in to see your borrowed books and saved lists.</p>
      </div>
      <ul>
        <li>Borrow up to 5 books</li>
        <li>Renew online in one click</li>
        <li>Save your reading lists</li>
      </ul>
    </aside>

    <section class="panel">
      <h1>Sign in</h1>
      <p class="hint">Use the email you registered with.</p>

      <form id="loginForm" method="post" action="#">
        <div class="row">
          <label for="userEmail">Email</label>
          <div class="control">
            <input type="email" id="userEmail" name="email" autocomplete="username"
                   placeholder="you@example.com" required>
          </div>
        </div>

        <div class="row">
          <label for="userPass">Password</label>
          <div class="control">
            <input type="password" id="userPass" name="password" autocomplete="current-password"
                   placeholder="Your password" minlength="6" required>
            <button type="button" class="toggle" id="togglePass" aria-pressed="false">Show</button>
          </div>
        </div>

        <div class="extras">
          <div class="remember">
            <input type="checkbox" id="rememberMe" name="remember">
            <label for="rememberMe">Keep me signed in</label>
          </div>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="go">Sign in</button>
        <p id="status" role="status"></p>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailEl = document.getElementById('userEmail');
    const passEl = document.getElementById('userPass');
    const rememberEl = document.getElementById('rememberMe');
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('togglePass');

    // restore the remembered email, if any
    try {
      const saved = localStorage.getItem('lib-email');
      if (saved) { emailEl.value = saved; rememberEl.checked = true; }
    } catch (e) { /* storage may be blocked */ }

    toggleBtn.addEventListener('click', () => {
      const hidden = passEl.type === 'password';
      passEl.type = hidden ? 'text' : 'password';
      toggleBtn.textContent = hidden ? 'Hide' : 'Show';
      toggleBtn.setAttribute('aria-pressed', String(hidden));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      try {
        if (rememberEl.checked) localStorage.setItem('lib-email', emailEl.value);
        else localStorage.removeItem('lib-email');
      } catch (e) { /* ignore */ }
      statusEl.className = 'ok';
      statusEl.textContent = 'Signed in as ' + emailEl.value + (rememberEl.checked ? ' (remembered)' : '');
    });
  </script>
</body>
</html>
