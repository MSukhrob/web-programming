<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      line-height: 1.5;
    }
    .contact-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    header {
      margin-bottom: 22px;
    }
    h1 {
      font-size: 1.45rem;
      color: #0f172a;
      margin-bottom: 4px;
    }
    p.intro {
      font-size: 0.9rem;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    input:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    input:valid:not(:placeholder-shown),
    textarea:valid:not(:placeholder-shown) {
      border-color: #16a34a;
      background-color: #f0fdf4;
    }
    input:invalid:not(:placeholder-shown),
    textarea:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
      background-color: #fef2f2;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }
    .alert-success {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background-color: #dcfce7;
      border: 1px solid #86efac;
      color: #166534;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="contact-card">
    <header>
      <h1>contact form</h1>
      <p class="intro">send a message with html5 form validation</p>
    </header>

    <form method="post" action="#" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="senderName">your name</label>
        <input
          type="text"
          id="senderName"
          name="name"
          required
          minlength="2"
          placeholder="enter your full name"
        >
      </div>

      <div class="form-group">
        <label for="senderEmail">email address</label>
        <input
          type="email"
          id="senderEmail"
          name="email"
          required
          placeholder="name@example.com"
        >
      </div>

      <div class="form-group">
        <label for="subject">subject</label>
        <input
          type="text"
          id="subject"
          name="subject"
          required
          minlength="3"
          placeholder="message topic"
        >
      </div>

      <div class="form-group">
        <label for="message">message</label>
        <textarea
          id="message"
          name="message"
          required
          minlength="10"
          rows="4"
          placeholder="write your message here (min 10 characters)..."
        ></textarea>
      </div>

      <button type="submit">send message</button>
      <div id="successMsg" class="alert-success"></div>
    </form>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      const alert = document.getElementById('successMsg');
      const name = document.getElementById('senderName').value;
      alert.style.display = 'block';
      alert.textContent = 'thank you, ' + name + '! your message has been sent successfully.';
    }
  </script>
</body>
</html>
