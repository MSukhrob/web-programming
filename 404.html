<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <style>
    body{min-height:100vh;margin:0;background:radial-gradient(500px 300px at 85% 0%,rgba(6,182,212,.18),transparent 70%),radial-gradient(500px 300px at 0% 20%,rgba(26,86,219,.16),transparent 70%),#f4f7fe;color:#0f172a}
    img{animation:pop .7s ease both}
    h1{font-size:clamp(2rem,6vw,3rem);margin:18px 0 6px;background:linear-gradient(90deg,#1a56db,#06b6d4,#1a56db);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeUp .7s .15s ease both,shimmer 4s linear infinite}
    p{animation:fadeUp .7s .3s ease both}
    a{display:inline-block;background:linear-gradient(135deg,#1a56db,#3b82f6);color:#fff;padding:10px 22px;border-radius:10px;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s}
    a:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(26,86,219,.35)}
    a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
    @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes shimmer{to{background-position:200% center}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body style="text-align:center;padding:60px;font-family:sans-serif;">
  <img src="https://media.giphy.com/media/yZYdkuQsRp8ixIVJQu/giphy.gif" alt="Animated GIF of a person thinking, looking confused" width="300" style="max-width:100%;height:auto;border-radius:10px;">
  <h1>404 — Oops!</h1>
  <p>This page does not exist. Even Git could not find it.</p>
  <p><a href="./">← Back to all tasks</a></p>
</body>
</html>
